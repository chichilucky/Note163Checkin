name: Run

on:
    workflow_dispatch:
    schedule:
        - cron: "8 1 * * *"

  workflow_dispatch:

jobs:
  build:

    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - name: Run
      uses: coactions/setup-xvfb@main
      with:
        run: dotnet Program.cs
      env: 
        CONF: ${{ secrets.CONF }}